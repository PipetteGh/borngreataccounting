[package]
name = "borngreataccounting-desktop"
version = "1.0.0"
description = "BorngreatAccounting (BtAccounting) Desktop Runtime Manager"
authors = ["Peter Borngreat-Mensah"]
license = "AGPL-3.0"
repository = "https://github.com/PipetteGh/Borngreat-Accounting---QuickBooks-Alternative"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = ["shell-open"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
