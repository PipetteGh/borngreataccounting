name: Publish Docker Images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/pipettegh/borngreataccounting-web
  API_IMAGE: ghcr.io/pipettegh/borngreataccounting-api
  WORKER_IMAGE: ghcr.io/pipettegh/borngreataccounting-worker

jobs:
  build-and-push:
    name: Build & Push Multi-Arch GHCR Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="edge-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push BorngreatAccounting Web image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.VERSION }}

      - name: Build and push BorngreatAccounting API & Worker images
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ steps.vars.outputs.VERSION }}
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ steps.vars.outputs.VERSION }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.API_IMAGE }}:latest
          format: cyclonedx-json
          output-file: borngreataccounting-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: borngreataccounting-sbom
          path: borngreataccounting-sbom.cdx.json
