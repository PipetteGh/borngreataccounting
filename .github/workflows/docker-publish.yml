name: Publish Docker Images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/pipettegh/borngreataccounting-web
  API_IMAGE: ghcr.io/pipettegh/borngreataccounting-api
  WORKER_IMAGE: ghcr.io/pipettegh/borngreataccounting-worker

jobs:
  build-and-push:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies & build workspace bundles
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build:shared
          pnpm --filter "@borngreataccounting/server" run build
          pnpm --filter "@borngreataccounting/webapp" run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="edge-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push BorngreatAccounting Web image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:1.0.0
            ${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.VERSION }}

      - name: Build and push BorngreatAccounting API & Worker images
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:1.0.0
            ${{ env.API_IMAGE }}:${{ steps.vars.outputs.VERSION }}
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:1.0.0
            ${{ env.WORKER_IMAGE }}:${{ steps.vars.outputs.VERSION }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.API_IMAGE }}:latest
          format: cyclonedx-json
          output-file: borngreataccounting-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: borngreataccounting-sbom
          path: borngreataccounting-sbom.cdx.json
