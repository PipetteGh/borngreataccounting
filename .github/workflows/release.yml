name: Release BorngreatAccounting

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  prepare-windows-exe:
    name: Package Windows EXE & Checksums
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack & Install Dependencies
        shell: pwsh
        run: |
          corepack enable
          pnpm install --ignore-scripts

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Build Windows Inno Setup Installer EXE & Generate SHA256SUMS
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.4" }
          powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\build-windows-installer.ps1" -Version $version -ForceBuild
          Compress-Archive -Path "docker", "docker-compose.production.yml", ".env.production.example", "install.sh", "install.ps1", "backup.sh", "restore.sh", "backup.ps1", "restore.ps1", "upgrade.sh", "upgrade.ps1", "LICENSE", "DISCLAIMER", "NOTICE", "README.md" -DestinationPath "dist\installers\BorngreatAccounting-Docker-Deploy-$version.zip" -Force
          Get-ChildItem "dist\installers\*" -Exclude "SHA256SUMS.txt" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Set-Content -Path "dist\installers\SHA256SUMS.txt" -Encoding ASCII

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installers/BorngreatAccounting-Setup*.exe
            dist/installers/BorngreatAccounting-Docker-Deploy*.zip
            dist/installers/SHA256SUMS.txt
