name: Build and Deploy Develop Docker Container
on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  WEBAPP_IMAGE_NAME: ghcr.io/pipettegh/borngreataccounting-web
  SERVER_IMAGE_NAME: ghcr.io/pipettegh/borngreataccounting-api

jobs:
  build-publish-develop:
    name: Build and deploy develop containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Webapp develop image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/frontend/Dockerfile
          push: true
          tags: ${{ env.WEBAPP_IMAGE_NAME }}:develop

      - name: Build and push Server develop image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/backend/Dockerfile
          push: true
          tags: ${{ env.SERVER_IMAGE_NAME }}:develop
