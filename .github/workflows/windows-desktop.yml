name: Build Windows Desktop Installer (EXE)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    name: Build BorngreatAccounting-Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Dependencies
        shell: pwsh
        run: pnpm install --ignore-scripts

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Build Windows Inno Setup Installer EXE
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\build-windows-installer.ps1" -Version "1.0.7" -ForceBuild

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BorngreatAccounting-Windows-Installer
          path: |
            dist/installers/BorngreatAccounting-Setup.exe
            dist/installers/BorngreatAccounting-Setup-1.0.6.exe
            dist/installers/SHA256SUMS.txt
