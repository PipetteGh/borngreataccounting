name: Build and Deploy Docker Container
on:
  release:
    types: [created]
  workflow_dispatch:

env:
  WEBAPP_IMAGE_NAME: ghcr.io/pipettegh/borngreataccounting-web
  SERVER_IMAGE_NAME: ghcr.io/pipettegh/borngreataccounting-api

jobs:
  build-publish-webapp:
    name: Build and deploy BorngreatAccounting web container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WEBAPP_IMAGE_NAME }}:latest,${{ env.WEBAPP_IMAGE_NAME }}:${{ github.ref_name }}

  build-publish-server:
    name: Build and deploy BorngreatAccounting server container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.SERVER_IMAGE_NAME }}:latest,${{ env.SERVER_IMAGE_NAME }}:${{ github.ref_name }}
